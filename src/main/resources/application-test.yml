spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: true
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false   # não inicia listeners Kafka durante testes sem broker

topic: simple.topic.kafka.test

pokeapi:
  base-url: http://localhost:8080/
